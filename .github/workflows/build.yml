name: Build ABH Browser APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ABHBrowser.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ABHBrowser
        run: gradle assembleDebug --no-daemon
      - run: cp ABHBrowser/app/build/outputs/apk/debug/app-debug.apk ABH-Browser.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ABH Browser (latest build)
          files: ABH-Browser.apk
